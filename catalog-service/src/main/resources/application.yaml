server:
  port: ${SERVER_PORT:8088}

spring:
  application:
    name: catalog-service
  datasource:
    url: ${CATALOG_DB_URL:jdbc:postgresql://localhost:5438/gearpc_catalog}
    username: ${CATALOG_DB_USERNAME:gearpc_catalog}
    password: ${CATALOG_DB_PASSWORD:catalog_dev}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  data:
    web:
      pageable:
        one-indexed-parameters: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/gearpc}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8080/realms/gearpc/protocol/openid-connect/certs}

eureka:
  instance:
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

keycloak:
  resource-client-id: ${KEYCLOAK_RESOURCE_CLIENT_ID:gear-pc-app}
