spring:
  application:
    name: GearPC

  profiles:
    default: dev

  # Cấu hình Flyway
  flyway:
    enabled: true  #Cho phép tự động chạy Flyway khi ứng dụng khởi động
    locations: classpath:db/migration
    baseline-on-migrate: true #Đánh dấu schema hiện có làm baseline nếu chưa có lịch sử Flyway
    baseline-version: 1

  # Cấu hình JPA / Hibernate
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  data:
    web:
      pageable:
        one-indexed-parameters: false

server:
  port: ${SERVER_PORT:8086}
