spring:

  docker:
    compose:
      enabled: false

  datasource:
    url: ${STG_DB_URL}
    username: ${STG_DB_USERNAME}
    password: ${STG_DB_PASSWORD}
    hikari:
      maximum-pool-size: ${STG_DB_MAX_POOL_SIZE:10}
      minimum-idle: ${STG_DB_MIN_IDLE:2}

  data:
    redis:
      host: ${STG_REDIS_HOST}
      port: ${STG_REDIS_PORT:6379}
      password: ${STG_REDIS_PASSWORD}

  jpa:
    show-sql: false
server:
  port: ${STG_SERVER_PORT:8086}
