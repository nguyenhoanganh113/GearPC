services:
  postgres:
    image: 'postgres:16-alpine'
    container_name: gear-pc-postgres
    environment:
      - 'POSTGRES_DB=gearpc_db'
      - 'POSTGRES_PASSWORD=123456'
      - 'POSTGRES_USER=postgres'
    ports:
      - '5435:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
  redis:
    image: 'redis:7-alpine'
    container_name: gear-pc-redis
    ports:
      - '6378:6379'
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
