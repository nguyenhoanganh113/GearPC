server:
  port: 8085

spring:
  application:
    name: media-service
  datasource:
    url: ${MEDIA_DB_URL:jdbc:postgresql://localhost:5435/gearpc_media}
    username: ${MEDIA_DB_USERNAME:gearpc_media}
    password: ${MEDIA_DB_PASSWORD:media_dev}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access:
    name: ${MINIO_ACCESS_KEY:admin}
    secret: ${MINIO_SECRET_KEY:123456788}
  bucket:
    name: ${MINIO_BUCKET_NAME:gear-pc}
  folder:
    name: ${MINIO_FOLDER_NAME:uploads}

app:
  file-upload:
    presigned-put-url-expiry-seconds: 1800
    presigned-get-url-expiry-seconds: 1800
    session-ttl-seconds: 86400
    max-image-file-size: 52428800

eureka:
  instance:
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
